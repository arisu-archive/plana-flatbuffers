name: Python Package

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Sync project
        run: uv sync

      - name: Run Python tests
        run: uv run python -B -m unittest discover -s tests/python -v

      - name: Build distributions
        run: uv build --no-sources

      - name: Verify wheel in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-project --with "$wheel" -- python -c \
            "from FlatData.BlendInfo import BlendInfoT; from MX.Data.Excel.WorldRaidStageRewardExcel import WorldRaidStageRewardExcelT"
